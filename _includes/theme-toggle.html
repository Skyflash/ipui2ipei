{% assign short_lang = page.lang | slice: 0, 2 | default: site.default_lang %}
{% assign i18n = site.data.i18n %}
<div class="theme-switch" role="group" aria-label="{{ i18n.theme_group_label[short_lang] }}">
  <button type="button" class="theme-switch__btn" data-theme-choice="auto" aria-label="{{ i18n.theme_auto[short_lang] }}" aria-pressed="false">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.4"/><path d="M8 2 A6 6 0 0 1 8 14 Z" fill="currentColor"/></svg>
  </button>
  <button type="button" class="theme-switch__btn" data-theme-choice="light" aria-label="{{ i18n.theme_light[short_lang] }}" aria-pressed="false">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3.5" stroke="currentColor" stroke-width="1.4"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.4 1.4M11.55 11.55l1.4 1.4M3.05 12.95l1.4-1.4M11.55 4.45l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
  <button type="button" class="theme-switch__btn" data-theme-choice="dark" aria-label="{{ i18n.theme_dark[short_lang] }}" aria-pressed="false">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5 5.5 5.5 0 1 0 13.5 9.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </button>
</div>
