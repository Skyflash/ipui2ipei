<!DOCTYPE html>
<html lang="{{ page.lang | slice: 0, 2 | default: site.default_lang }}">
<head>
{% include head.html %}
</head>
<body>
  <div class="page">
    {{ content }}
  </div>
  {% include footer.html %}
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/ipui2ipei.js' | relative_url }}"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("{{ '/sw.js' | relative_url }}", {
          scope: "{{ '/' | relative_url }}"
        });
      });
    }
  </script>
</body>
</html>
